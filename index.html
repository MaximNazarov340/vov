<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Даты ВОВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: тетрадь в клетку — одна колонка, сверху вкладки, маркеры по годам как в конспекте */
:root{
  --bg:#f7f8fb; --grid:#e3e7f0; --paper:#ffffff; --ink:#1d2340; --muted:#5d6584; --line:#d5dae7;
  --accent:#2f3fb8; --ok:#1f8a4c; --bad:#c23a2b;
  --y0:#d9dbe3; --y41:#ffc9a8; --y42:#a9e3ef; --y43:#ffe867; --y44:#bfe8b4; --y45:#dcc3fb; --yh:#f5d0c4;
  --f-disp:"Unbounded",system-ui,sans-serif; --f-body:"Golos Text",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13162a; --grid:#1d2140; --paper:#1a1e36; --ink:#e8eaf6; --muted:#9aa1c4; --line:#2e3358;
  --accent:#8f9cff; --ok:#5fd18f; --bad:#ff7d6e;
  --y0:#3a3e55; --y41:#7a4428; --y42:#1f5966; --y43:#6b5d10; --y44:#2f5a29; --y45:#4f3577; --yh:#6a3a30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13162a; --grid:#1d2140; --paper:#1a1e36; --ink:#e8eaf6; --muted:#9aa1c4; --line:#2e3358;
  --accent:#8f9cff; --ok:#5fd18f; --bad:#ff7d6e;
  --y0:#3a3e55; --y41:#7a4428; --y42:#1f5966; --y43:#6b5d10; --y44:#2f5a29; --y45:#4f3577; --yh:#6a3a30; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(24px,5vw,34px);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.tab{font:600 15px var(--f-body);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.tab:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.chip{font:500 13px var(--f-body);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -6px 0 var(--hl,var(--y0))}
section.year{margin-bottom:22px}
.ytitle{display:inline-block;font-family:var(--f-disp);font-weight:700;font-size:20px;padding:2px 10px;background:var(--hl);border:2px solid var(--ink);margin:6px 0 8px}
.row{display:grid;grid-template-columns:minmax(118px,auto) 1fr;gap:4px 14px;padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.row:first-of-type{border-top:1px solid var(--line)}
.d{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.d mark{background:linear-gradient(transparent 35%,var(--hl) 35%);color:inherit;padding:0 2px}
.e{min-width:0}
.note{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.fix{display:block;color:var(--bad);font-size:13px;margin-top:2px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.tw{overflow-x:auto;background:var(--paper);border:2px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.y{font-family:var(--f-mono);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.y mark{background:linear-gradient(transparent 35%,var(--hl) 35%);color:inherit;padding:0 2px}
td.l{white-space:nowrap;color:var(--muted);font-size:14px}
td.m{color:var(--muted);font-size:14px;min-width:180px}
tr.sep td{background:var(--hl);font-family:var(--f-disp);font-weight:700;font-size:15px;border-bottom:2px solid var(--ink)}
.sh{font-family:var(--f-disp);font-size:20px;margin:6px 0 8px;text-wrap:balance}
.inp{font:700 28px var(--f-mono);width:100%;max-width:200px;padding:10px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.tform{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tform .btn{flex:0 1 180px}
.ask{font:600 15px var(--f-body);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.mgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:14px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{font:500 15px var(--f-body);text-align:left;padding:10px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;transition:background .15s}
.mbtn.y{font:700 15px var(--f-mono)}
.mbtn.sel{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.mbtn.okm{background:var(--ok);border-color:var(--ok);color:var(--paper);cursor:default}
.mbtn.bad{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.num{font-family:var(--f-mono);font-weight:700;margin-right:6px}
[hidden]{display:none!important}
.mstat{font:500 14px var(--f-body);padding:8px 12px;margin-top:10px;border:1.5px dashed var(--line);background:var(--paper)}
.reset{font:500 13px var(--f-body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
.bzhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bzclock{font:700 40px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.hint{background:var(--paper);border:1.5px dashed var(--line);padding:12px 14px;margin:0 0 16px;font-size:14px}
.hint b{font-family:var(--f-mono)}
/* карточки */
.card{background:var(--paper);border:2px solid var(--ink);min-height:230px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;position:relative;box-shadow:6px 6px 0 var(--hl,var(--y0))}
.card .q{font-size:clamp(19px,3.6vw,24px);font-weight:600;text-wrap:balance}
.card .a{font-family:var(--f-mono);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--accent)}
.card .tag{position:absolute;top:10px;right:12px;font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1 1 140px;font:600 16px var(--f-body);padding:13px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:12px 0 0;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
/* тест */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font:700 17px var(--f-mono);padding:14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.done{padding:30px;text-align:center;background:var(--paper);border:2px solid var(--ink)}
.done h2{font-family:var(--f-disp);margin:0 0 6px}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <h1>Даты ВОВ</h1>
  <p class="sub">Только года и числа из твоего конспекта. Учи по шпаргалке, потом гоняй карточки и тест.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-blitz" aria-selected="false" data-v="blitz">Повтор 5 мин</button>
    <button class="tab" role="tab" id="t-drill" aria-selected="true" data-v="drill">Зубрёжка за час</button>
    <button class="tab" role="tab" id="t-table" aria-selected="false" data-v="table">Таблица</button>
    <button class="tab" role="tab" id="t-list" aria-selected="false" data-v="list">Точные даты</button>
    <button class="tab" role="tab" id="t-cards" aria-selected="false" data-v="cards">Карточки</button>
    <button class="tab" role="tab" id="t-quiz" aria-selected="false" data-v="quiz">Тест</button>
  </div>
  <div class="filters" id="filters"></div>

  <div id="v-blitz" hidden></div>
  <div id="v-drill"></div>
  <div id="v-table" hidden></div>
  <div id="v-list" hidden></div>

  <div id="v-cards" hidden>
    <div class="filters modes"></div>
    <div id="cardbox"></div>
    <div class="stat" id="cstat"></div>
    <div class="bar"><i id="cbar" style="width:0"></i></div>
    <p class="small">Нажми на карточку или пробел — увидишь ответ. «Не знаю» вернёт карточку в конец стопки. Клавиши: 1 — знаю, 2 — не знаю.</p>
  </div>

  <div id="v-quiz" hidden>
    <div class="filters modes"></div>
    <div id="quizbox"></div>
    <div class="stat" id="qstat"></div>
  </div>
</div>

      const ys=it.map(r=>r.d),extraY=dOpts(ys[0]).filter(y=>!ys.includes(y)).concat(shuffle(ALLY.filter(y=>!ys.includes(y)))).filter((y,i,a)=>a.indexOf(y)===i).slice(0,2);

  };
  return (wantOrder?mk.order()||mk.match():mk.match()||mk.order());

    if(st.rev)h+=`<p>${st.final?"Всё вперемешку.":"Всё с начала войны до 1943 вперемешку."} Сразу уровень 2 — вписываешь год сам. Ошибся — вопрос вернётся с вариантами.</p>`;
    else{
      h+=`<p class="small">Прочитай вслух 2 раза. Закрой экран и проговори год каждого события. Потом жми кнопку.${ds.step>0?` В тренировке будут и вопросы из прошлых шагов (${Math.min(prevRows().length,6+3*ds.step)} шт.).`:""}</p><div class="tw"><table><tbody>`;
      rowsFor(st).forEach(r=>h+=`<tr style="--hl:var(${G[r.k].hl})"><td class="y"><mark>${esc(r.d)}</mark></td><td>${esc(r.e)}<span class="note">${esc(r.l)}${r.m?" · "+esc(r.m):""}</span></td></tr>`);
      h+=`</tbody></table></div>`;
    }
    h+=`<div class="btns"><button class="btn ok" id="go">${st.final?"Начать экзамен":"Начать тренировку"}</button></div>`;
    box.innerHTML=h;bind();return;
  }
  // конец шага
  if(!dq.length&&!dSp){
    ds.done=[...new Set([...ds.done,ds.step])];
    const hard=Object.values(dMisses).sort((a,b)=>b.n-a.n).slice(0,6);
    h+=`<div class="done"><h2>Шаг ${ds.step+1} пройден</h2><p>Верно ${dRight}, ошибок ${dWrong}.</p>${hard.length?`<p class="small">Самые трудные — проговори вслух 3 раза:</p>${hard.map(m=>`<div class="row" style="--hl:var(${G[m.r.k].hl})"><div class="d"><mark>${esc(m.r.d)}</mark></div><div class="e">${esc(m.r.e)}<span class="note">${esc(m.r.m||"")}</span></div></div>`).join("")}`:""}<div class="btns">${ds.step<STEPS.length-1?`<button class="btn ok" id="next">Следующий шаг →</button>`:""}<button class="btn" id="rep">Ещё раз этот шаг</button></div></div>`;
    saveDs();ds.phase="end";box.innerHTML=h;bind();
    const n=document.getElementById("next");if(n)n.onclick=()=>{ds.step++;ds.phase="learn";saveDs();renderDrill()};
    document.getElementById("rep").onclick=startDrill;return;
  }
  if(!dSp&&dCount>0&&dCount%5===0&&dSpAt!==dCount){dSpAt=dCount;dSp=makeSpecial()}
  const prog=Math.max(0,Math.round((1-leftPts()/dTotal)*100));
  h+=`<div class="bar"><i style="width:${prog}%"></i></div><p class="small">Шаг ${ds.step+1} · осталось ${dq.length} · верно ${dRight} · ошибок ${dWrong}</p>`;
  if(dSp){box.innerHTML=h+renderSpecial();bind();bindSpecial();return}
  const e=dq[0],q=e.r,g=G[q.k];
  const tag=`${g.t}${e.old?" · из прошлого шага":""}`;
  requestAnimationFrame(()=>{const c=box.querySelector(".card");if(c&&c.getBoundingClientRect().top<70)c.scrollIntoView({block:"start",behavior:"auto"})});
  if(e.s===0){
    h+=`<div class="card" style="--hl:var(${g.hl});cursor:default"><span class="tag">${tag} · уровень 1</span><div class="q">${esc(q.e)}</div><div id="fb"></div></div>
    <div class="opts">${dOpts(q.d).map((o,i)=>`<button class="opt" data-o="${esc(o)}">${i+1}) ${esc(o)}</button>`).join("")}</div>`;
    box.innerHTML=h;bind();dLock=false;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>dChoice(b));
  }else{
    const ys=yrs(q.d),multi=ys.length>1&&ys[0]!==ys[ys.length-1];
    if(e.ask==null)e.ask=multi&&Math.random()<.5?ys.length-1:0;
    const slash=q.d.includes("/");
    const label=!multi?"В каком году?":slash?(e.ask===0?"Первый год?":"Второй год?"):(e.ask===0?"В каком году НАЧАЛОСЬ?":"В каком году ЗАКОНЧИЛОСЬ?");
    h+=`<div class="card" style="--hl:var(${g.hl});cursor:default"><span class="tag">${tag} · уровень 2</span><div class="q">${esc(q.e)}</div><div class="ask">${label}</div><div id="fb"></div></div>
    <form class="tform" id="tf"><input id="ti" class="inp" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="19__" aria-label="Год"><button class="btn ok" type="submit">Проверить</button></form>`;
    box.innerHTML=h;bind();dLock=false;
    const inp=document.getElementById("ti");inp.focus();
    document.getElementById("tf").onsubmit=ev=>{ev.preventDefault();dType(inp.value)};
  }
}
function showFb(q){
  document.getElementById("fb").innerHTML=`<div class="a">${esc(q.d)}</div><div class="small">${esc(q.l||"")}${q.m?" · 💡 "+esc(q.m):""}</div><div class="btns"><button class="btn" id="cont">Понял, дальше (Enter)</button></div>`;
  document.getElementById("cont").onclick=renderDrill;
  const tf=document.getElementById("tf");if(tf)tf.remove();
}
function wrongEntry(e){dMiss(e.r);e.s=0;e.ask=null;dq.shift();dq.splice(Math.min(dq.length,2),0,e);dCount++}
function rightEntry(e){dRight++;e.s++;dq.shift();if(e.s<2)dq.splice(Math.min(dq.length,3+(Math.random()*4|0)),0,e);dCount++}
function dChoice(b){
  if(dLock)return;dLock=true;const e=dq[0],q=e.r,box=document.getElementById("v-drill");
  box.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===q.d)x.classList.add("right")});
  if(b.dataset.o===q.d){rightEntry(e);setTimeout(renderDrill,450)}
  else{b.classList.add("wrong");wrongEntry(e);showFb(q)}
}
function dType(v){
  if(dLock)return;v=(v||"").trim();if(!v)return;dLock=true;
  if(/^\d{2}$/.test(v))v="19"+v;
  const e=dq[0],q=e.r,target=yrs(q.d)[e.ask||0];
  if(+v===target){rightEntry(e);document.getElementById("fb").innerHTML=`<div class="a" style="color:var(--ok)">✓ ${esc(q.d)}</div>`;setTimeout(renderDrill,650)}
  else{wrongEntry(e);showFb(q);document.getElementById("fb").insertAdjacentHTML("afterbegin",`<div class="small" style="color:var(--bad)">Ты написал ${esc(v)}, правильно ${target}</div>`)}
}
function renderSpecial(){
  const s=dSp;let h="";
  if(s.type==="match"){
    h+=`<div class="card" style="cursor:default;min-height:0"><span class="tag">спецраунд</span><div class="q">Соотнеси события и годы</div><div class="small">Нажми событие и год (в любом порядке). Осторожно: 2 года лишние — им пары нет.</div>${s.err?`<div class="small" style="color:var(--bad)">Ошибок: ${s.err}</div>`:""}</div>
    <div class="mgrid"><div class="mcol">${s.items.map((r,j)=>`<button class="mbtn ${s.done.has(j)?"okm":""} ${s.sel===j?"sel":""}" data-me="${j}" ${s.done.has(j)?"disabled":""}>${esc(r.e)}</button>`).join("")}</div>
    <div class="mcol">${s.years.map((y,j)=>`<button class="mbtn y ${s.usedY.has(j)?"okm":""} ${s.selY===j?"sel":""}" data-my="${j}" ${s.usedY.has(j)?"disabled":""}>${esc(y)}</button>`).join("")}</div></div>`;
    h+=`<div class="mstat">${s.sel!=null?`Выбрано: <b>${esc(s.items[s.sel].e)}</b> — теперь нажми год`:s.selY!=null?`Выбран год <b>${esc(s.years[s.selY])}</b> — теперь нажми событие`:"Ничего не выбрано"}</div>`;
    if(s.done.size===s.items.length)h+=`<div class="btns"><button class="btn ok" id="spn">${s.err?"Готово, дальше":"Идеально! Дальше"}</button></div><div class="small">Лишние годы: ${s.years.filter(y=>!s.items.some(r=>r.d===y)).map(esc).join(", ")}</div>`;
  }else{
    h+=`<div class="card" style="cursor:default;min-height:0"><span class="tag">спецраунд</span><div class="q">Хронология: нажимай события от самого раннего к позднему (по году начала)</div>${s.err?`<div class="small" style="color:var(--bad)">Ошибок: ${s.err}</div>`:""}</div>
    <div class="mcol" style="margin-top:14px">${s.items.map((r,j)=>{const p=s.pos[j];return `<button class="mbtn ${p?"okm":""}" data-or="${j}" ${p?"disabled":""}>${p?`<span class="num">${p}.</span>`:""}${esc(r.e)}${p?` — <b>${esc(r.d)}</b>`:""}</button>`}).join("")}</div>`;
    if(s.got===4)h+=`<div class="btns"><button class="btn ok" id="spn">${s.err?"Готово, дальше":"Идеально! Дальше"}</button></div>`;
  }
  return h;
}
function flashBad(el){el.classList.add("bad");setTimeout(()=>{el.classList.remove("bad")},450)}
function bindSpecial(){
  const s=dSp,box=document.getElementById("v-drill");
  const n=document.getElementById("spn");if(n)n.onclick=()=>{if(!s.err)dRight++;dSp=null;renderDrill()};
  const tryPair=()=>{
    if(s.sel==null||s.selY==null)return renderDrill();
    const r=s.items[s.sel],j=s.selY,btn=box.querySelector(`[data-my="${j}"]`);
    if(r.d===s.years[j]){s.done.add(s.sel);s.usedY.add(j);s.sel=null;s.selY=null;renderDrill()}
    else{s.err++;dMiss(r);requeue(r);s.sel=null;s.selY=null;if(btn)flashBad(btn);setTimeout(renderDrill,450)}
  };
  const ex=document.getElementById("extra");if(ex)ex.onclick=()=>{
    if(s.sel==null){flashBad(ex);return}
    const r=s.items[s.sel];
    if(!s.years.includes(r.d)){s.done.add(s.sel);s.sel=null;s.selY=null;renderDrill()}
    else{s.err++;dMiss(r);requeue(r);s.sel=null;flashBad(ex);setTimeout(renderDrill,450)}
  };
  box.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{s.sel=+b.dataset.me;tryPair()});
  box.querySelectorAll("[data-my]").forEach(b=>b.onclick=()=>{s.selY=+b.dataset.my;tryPair()});
  box.querySelectorAll("[data-or]").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.or,r=s.items[j];
    if(y0(r.d)===y0(s.sorted[s.got].d)){s.got++;s.pos[j]=s.got;renderDrill()}
    else{s.err++;dMiss(r);requeue(r);flashBad(b);setTimeout(renderDrill,450)}
  });
}
document.addEventListener("keydown",e=>{
  if(view!=="drill"||ds.phase!=="drill")return;
  const c=document.getElementById("cont");
  if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();renderDrill();return}
  if(e.target.tagName==="INPUT")return;
  const n=+e.key;if(n>=1&&n<=4&&!dLock){const b=document.querySelectorAll("#v-drill .opt")[n-1];if(b)dChoice(b)}
});


// быстрый повтор: все события за 5 минут, сначала те, где ошибался
let hard={};try{hard=JSON.parse(localStorage.getItem("vov-hard")||"{}")||{}}catch(e){}
const saveHard=()=>{try{localStorage.setItem("vov-hard",JSON.stringify(hard))}catch(e){}};
let bz={on:false,q:[],t0:0,ok:0,bad:0,miss:[],lock:false,timer:0,total:0};
const BZ_SEC=300;
function blitzStart(){
  const all=T.map((r,i)=>({i,k:r[0],d:r[1],e:r[2],m:r[4]}));
  const hardFirst=shuffle(all.filter(r=>hard[r.i])).sort((a,b)=>(hard[b.i]||0)-(hard[a.i]||0));
  bz={on:true,q:hardFirst.concat(shuffle(all.filter(r=>!hard[r.i]))),t0:Date.now(),ok:0,bad:0,miss:[],lock:false,total:all.length};
  clearInterval(bz.timer);bz.timer=setInterval(blitzTick,250);blitzRender();
}
function blitzLeft(){return Math.max(0,BZ_SEC-Math.floor((Date.now()-bz.t0)/1000))}
function blitzTick(){
  const el=document.getElementById("bzclock");if(!bz.on)return;
  const l=blitzLeft();if(el)el.textContent=`${Math.floor(l/60)}:${String(l%60).padStart(2,"0")}`;
  if(l===0)blitzEnd();
}
function blitzEnd(){bz.on=false;clearInterval(bz.timer);blitzRender()}
function blitzRender(){
  const box=document.getElementById("v-blitz");
  if(!bz.on&&!bz.t0){
    const nh=Object.keys(hard).length;
    box.innerHTML=`<div class="done"><h2>Повтор за 5 минут</h2><p>Все ${T.length} событий, только годы. Отвечай быстро цифрами 1–4. Сначала идут события, где ты ошибался${nh?` (таких сейчас ${nh})`:""}. Ошибка — событие вернётся в конец.</p><div class="btns"><button class="btn ok" id="bzgo">Старт ⏱ 5:00</button></div></div>`;
    document.getElementById("bzgo").onclick=blitzStart;return;
  }
  if(!bz.on||!bz.q.length){
    if(bz.on)blitzEnd();
    const sec=Math.floor((Date.now()-bz.t0)/1000),uniq=[...new Map(bz.miss.map(r=>[r.i,r])).values()];
    box.innerHTML=`<div class="done"><h2>${bz.q.length?"Время вышло":"Всё пройдено!"}</h2><p>Верно ${bz.ok} · ошибок ${bz.bad} · осталось ${bz.q.length} из ${bz.total} · ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</p>${uniq.length?`<p class="small">Повтори глазами перед уроком:</p>${uniq.map(r=>`<div class="row" style="--hl:var(${G[r.k].hl})"><div class="d"><mark>${esc(r.d)}</mark></div><div class="e">${esc(r.e)}<span class="note">${esc(r.m||"")}</span></div></div>`).join("")}`:"<p>Без ошибок — ты готов 💪</p>"}<div class="btns"><button class="btn ok" id="bzgo">Ещё раз</button>${Object.keys(hard).length?`<button class="btn" id="bzclr">Забыть старые ошибки</button>`:""}</div></div>`;
    document.getElementById("bzgo").onclick=blitzStart;
    const c=document.getElementById("bzclr");if(c)c.onclick=()=>{hard={};saveHard();bz.t0=0;blitzRender()};
    return;
  }
  const q=bz.q[0],g=G[q.k],l=blitzLeft();
  const done=bz.total-bz.q.length;
  box.innerHTML=`<div class="bzhead"><span class="bzclock" id="bzclock">${Math.floor(l/60)}:${String(l%60).padStart(2,"0")}</span><span class="small">пройдено ${done} из ${bz.total} · ошибок ${bz.bad}</span></div><div class="bar"><i style="width:${done/bz.total*100}%"></i></div>
  <div class="card" style="--hl:var(${g.hl});cursor:default;min-height:150px;margin-top:12px"><span class="tag">${g.t}${hard[q.i]?" · была ошибка":""}</span><div class="q">${esc(q.e)}</div><div id="bzfb"></div></div>
  <div class="opts">${dOpts(q.d).map((o,i)=>`<button class="opt" data-o="${esc(o)}">${i+1}) ${esc(o)}</button>`).join("")}</div>`;
  bz.lock=false;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>blitzAnswer(b));
}
function blitzAnswer(b){
  if(bz.lock||!bz.on)return;bz.lock=true;const q=bz.q[0];
  document.querySelectorAll("#v-blitz .opt").forEach(x=>{if(x.dataset.o===q.d)x.classList.add("right")});
  bz.q.shift();
  if(b.dataset.o===q.d){bz.ok++;if(hard[q.i]){hard[q.i]--;if(hard[q.i]<=0)delete hard[q.i];saveHard()}setTimeout(blitzRender,250)}
  else{bz.bad++;b.classList.add("wrong");bz.miss.push(q);hard[q.i]=(hard[q.i]||0)+2;saveHard();bz.q.splice(Math.min(bz.q.length,5),0,q);
    document.getElementById("bzfb").innerHTML=`<div class="a" style="font-size:24px">${esc(q.d)}</div>${q.m?`<div class="small">💡 ${esc(q.m)}</div>`:""}`;setTimeout(blitzRender,1300)}
}
document.addEventListener("keydown",e=>{
  if(view!=="blitz"||!bz.on||e.target.tagName==="INPUT")return;
  const n=+e.key;if(n>=1&&n<=4){const b=document.querySelectorAll("#v-blitz .opt")[n-1];if(b)blitzAnswer(b)}
});

let view="drill";
function setView(v){
  view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));
  ["blitz","drill","table","list","cards","quiz"].forEach(x=>document.getElementById("v-"+x).hidden=x!==v);
  document.getElementById("filters").hidden=v==="drill"||v==="blitz";if(v==="drill")renderDrill();if(v==="blitz")blitzRender();
  try{localStorage.setItem("vov-view",v)}catch(e){}
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));
document.addEventListener("keydown",e=>{
  if(view!=="cards"||!deck.length)return;
  if(e.key===" "){e.preventDefault();shown=!shown;renderCard()}
  else if(e.key==="1")answer(true);else if(e.key==="2")answer(false);
});
renderModes();renderFilters();renderTable();renderList();newDeck();newQuiz();
setView("drill");try{const v=localStorage.getItem("vov-view");if(v)setView(v)}catch(e){}
</script>
